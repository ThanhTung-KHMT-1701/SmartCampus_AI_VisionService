services:
  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ${CONTAINER_MYSQL:-fit4110-mysql-lab05}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_vision_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - team-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-vision:
    image: ${IMAGE_AI_VISION}
    container_name: ${CONTAINER_AI_VISION}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./src:/service:ro
    environment:
      # ── MySQL Database ─────────────────────────────────────────────────────
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_vision_db}
      # ── AI Service internal URL ─────────────────────────────────────────
      AI_SERVICE_URL: http://${SERVICE_AI_SERVICE}:${AI_SERVICE_PORT}
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - team-internal
      - host-bridge
    ports:
      - "${APP_PORT}:${APP_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT}/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai-service:
    build:
      context: .
      dockerfile: ${DOCKERFILE_AI_SERVICE}
    container_name: ${CONTAINER_AI_SERVICE}
    image: ${IMAGE_AI_SERVICE}
    restart: unless-stopped
    working_dir: /service
    networks:
      - team-internal
      - host-bridge
    ports:
      - "${AI_SERVICE_PORT}:${AI_SERVICE_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AI_SERVICE_PORT}/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  team-internal:
    driver: bridge
  host-bridge:
    driver: bridge

volumes:
  mysql_data:
