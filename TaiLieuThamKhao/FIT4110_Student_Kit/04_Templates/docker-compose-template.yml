# Minimal Compose illustration only — not a complete Lab 05 submission.
# Mẫu Compose tối thiểu để minh hoạ — không phải bài nộp Lab 05 hoàn chỉnh.
# Add only dependencies that match your service boundary and source-lab requirements.
# Chỉ thêm dependency phù hợp service boundary và yêu cầu của repo Lab nguồn.

services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # This Python example assumes the image contains Python and urllib.
    # Ví dụ Python này giả định image có Python và urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: ["db-data:/var/lib/postgresql/data"]
    networks: [internal]
networks:
  internal:
volumes:
  db-data:
