name: smartcampus-vision-lab04

services:
  ai-vision:
    build:
      context: .
      dockerfile: Dockerfile
    image: fit4110/ai-vision:lab04
    container_name: fit4110-ai-vision-lab04
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      AI_VISION_AUTH_TOKEN: ${AI_VISION_AUTH_TOKEN:-local-dev-token-vision}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-net

  core-business-mock:
    build:
      context: .
      dockerfile: Dockerfile.core-mock
    image: fit4110/core-business-mock:lab04
    container_name: fit4110-core-mock-lab04
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "4012"
      CORE_AUTH_TOKEN: ${CORE_AUTH_TOKEN:-lab-token-core}
    ports:
      - "4012:4012"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4012/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-net

  camera-stream-mock:
    build:
      context: .
      dockerfile: Dockerfile.camera-mock
    image: fit4110/camera-stream-mock:lab04
    container_name: fit4110-camera-mock-lab04
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "4014"
      CAMERA_AUTH_TOKEN: ${CAMERA_AUTH_TOKEN:-lab-token-camera}
    ports:
      - "4014:4014"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4014/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-net

networks:
  lab-net:
    name: smartcampus-lab-net
    driver: bridge
