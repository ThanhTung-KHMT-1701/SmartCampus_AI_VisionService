name: smartcampus-vision-lab04-gateway

services:
  # 3 downstream services. Internal-only (no ports: published to host).
  ai-vision:
    image: fit4110/ai-vision:lab04
    container_name: fit4110-ai-vision-lab04-gw
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      AI_VISION_AUTH_TOKEN: ${AI_VISION_AUTH_TOKEN:-local-dev-token-vision}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-net
    # No `ports:` block by design — service is reachable only via Gateway.

  core-business-mock:
    image: fit4110/core-business-mock:lab04
    container_name: fit4110-core-mock-lab04-gw
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "4012"
      CORE_AUTH_TOKEN: ${CORE_AUTH_TOKEN:-lab-token-core}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4012/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-net

  camera-stream-mock:
    image: fit4110/camera-stream-mock:lab04
    container_name: fit4110-camera-mock-lab04-gw
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "4014"
      CAMERA_AUTH_TOKEN: ${CAMERA_AUTH_TOKEN:-lab-token-camera}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4014/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-net

  # API Gateway — only public surface.
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: fit4110/api-gateway:lab04
    container_name: fit4110-api-gateway-lab04
    restart: unless-stopped
    depends_on:
      ai-vision:
        condition: service_healthy
      core-business-mock:
        condition: service_healthy
      camera-stream-mock:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:-local-dev-token-gateway}
      AI_VISION_BASE_URL: http://ai-vision:8000
      CORE_BUSINESS_BASE_URL: http://core-business-mock:4012
      CAMERA_STREAM_BASE_URL: http://camera-stream-mock:4014
      AI_VISION_AUTH_TOKEN: ${AI_VISION_AUTH_TOKEN:-local-dev-token-vision}
      CORE_AUTH_TOKEN: ${CORE_AUTH_TOKEN:-lab-token-core}
      CAMERA_AUTH_TOKEN: ${CAMERA_AUTH_TOKEN:-lab-token-camera}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lab-net

networks:
  lab-net:
    name: smartcampus-lab-net-gateway
    driver: bridge
